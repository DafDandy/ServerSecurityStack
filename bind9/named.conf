// Bind9 Configuration File
// Internal DNS Server for federationofdaf.com

options {
    directory "/var/cache/bind";
    
    // Allow queries from internal network only
    allow-query { 192.168.0.0/24; localhost; };
    allow-query-cache { 192.168.0.0/24; localhost; };
    
    // Forward unknown queries to public DNS
    forwarders {
        8.8.8.8;
        8.8.4.4;
    };
    forward only;
    
    // Performance settings
    recursion yes;
    dnssec-validation no;
    auth-nxdomain no;
    
    // Logging
    listen-on { 0.0.0.0; };
    listen-on-v6 { any; };
};

// Logging configuration
logging {
    channel default_log {
        file "/var/log/bind/named.log" versions 7 size 50M;
        severity debug;
        print-time yes;
        print-severity yes;
        print-category yes;
    };
    category default { default_log; };
};

// federationofdaf.com Zone
zone "federationofdaf.com" {
    type master;
    file "/etc/bind/zones/db.federationofdaf.com";
    allow-update { none; };
};

// Reverse DNS Zone for 192.168.0.0/24
zone "0.168.192.in-addr.arpa" {
    type master;
    file "/etc/bind/zones/db.192.168.0.rev";
    allow-update { none; };
};

// Include additional BIND configuration files if they exist
include "/etc/bind/named.conf.default-zones";