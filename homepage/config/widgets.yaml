---
# For configuration options and examples, please see:
# https://gethomepage.dev/widgets/

- datetime:
    text_size: 2x1
    format:
      dateStyle: short
      timeStyle: short
      hour12: true

- resources:
    label: System
    cpu: true
    cputemp: true
    tempmin: 0
    tempmax: 80
    memory: true
    disk: /
    network: true
    uptime: true


- search:
    provider: duckduckgo
    target: blank_
