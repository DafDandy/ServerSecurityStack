# Based on: https://github.com/gethomepage/homepage/discussions/3256

services:
  homepage:
    container_name: homepage
    image: ghcr.io/gethomepage/homepage:latest
    restart: unless-stopped
    ports:
      - 3000:3000
    environment:
      - PUID=1000
      - PGID=1000
      - HOMEPAGE_ALLOWED_HOSTS=$STATIC_IP:3000
      - HOMEPAGE_VAR_IMMICH_URL=$HOMEPAGE_VAR_IMMICH_URL
      - HOMEPAGE_VAR_IMMICH_EXTERNAL_URL=$HOMEPAGE_VAR_IMMICH_EXTERNAL_URL
      - HOMEPAGE_VAR_IMMICH_KEY=$HOMEPAGE_VAR_IMMICH_KEY
      - HOMEPAGE_VAR_JELLYFIN_URL=$HOMEPAGE_VAR_JELLYFIN_URL
      - HOMEPAGE_VAR_JELLYFIN_EXTERNAL_URL=$HOMEPAGE_VAR_JELLYFIN_EXTERNAL_URL
      - HOMEPAGE_VAR_JELLYFIN_KEY=$HOMEPAGE_VAR_JELLYFIN_KEY
      - HOMEPAGE_VAR_PORTAINER_URL=$HOMEPAGE_VAR_PORTAINER_URL
      - HOMEPAGE_VAR_PORTAINER_KEY=$HOMEPAGE_VAR_PORTAINER_KEY
      - HOMEPAGE_VAR_AUDIOBOOKSHELF_URL=$HOMEPAGE_VAR_AUDIOBOOKSHELF_URL
      - HOMEPAGE_VAR_AUDIOBOOKSHELF_EXTERNAL_URL=$HOMEPAGE_VAR_AUDIOBOOKSHELF_EXTERNAL_URL
      - HOMEPAGE_VAR_AUDIOBOOKSHELF_KEY=$HOMEPAGE_VAR_AUDIOBOOKSHELF_KEY
      - HOMEPAGE_VAR_OCTOPRINT=$HOMEPAGE_VAR_OCTOPRINT
      - HOMEPAGE_VAR_OCTOPRINT_KEY=$HOMEPAGE_VAR_OCTOPRINT_KEY
      - HOMEPAGE_VAR_UPTIME_KUMA_URL=$HOMEPAGE_VAR_UPTIME_KUMA_URL
      - HOMEPAGE_VAR_CLOUDFLARE_ACCOUNTID=$HOMEPAGE_VAR_CLOUDFLARE_ACCOUNTID
      - HOMEPAGE_VAR_CLOUDFLARE_TUNNELID=$HOMEPAGE_VAR_CLOUDFLARE_TUNNELID
      - HOMEPAGE_VAR_CLOUDFLARE_KEY=$HOMEPAGE_VAR_CLOUDFLARE_KEY
      - HOMEPAGE_VAR_UNIFI_URL=$HOMEPAGE_VAR_UNIFI_URL
      - HOMEPAGE_VAR_UNIFI_KEY=$HOMEPAGE_VAR_UNIFI_KEY
      - HOMEPAGE_VAR_UNIFI_USER=$HOMEPAGE_VAR_UNIFI_USER
      - HOMEPAGE_VAR_UNIFI_PASSWORD=$HOMEPAGE_VAR_UNIFI_PASSWORD
    volumes:
      - ./config:/app/config
      - ./images:/app/public/images
      - ./icons:/app/public/icons
    networks:
      - homepage
      - socket-proxy
      - traefik
      - watchtower
    depends_on:
      - socket-proxy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.homepage.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.homepage.entrypoints=websecure"
      - "traefik.http.routers.homepage.tls.certresolver=letsencrypt"
      - "traefik.http.routers.homepage.middlewares=chain-secure-ip@file"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"
    security_opt:
      - no-new-privileges:true
