http:
  middlewares:
    authentik:
      forwardauth:
        address: http://server:9000/api/verify?rd=https://auth.federationofdaf.com
        trustForwardHeader: true
        authResponseHeaders: Remote-User,Remote-Groups,Remote-Name,Remote-Email
    crowdsec-bouncer:
      forwardauth:
        address: http://bouncer-traefik:8080/api/v1/forwardAuth
        trustForwardHeader: true
    ip-whitelist:
      ipAllowList:
        sourceRange:
          - 0.0.0.0/24
    rate-limit:
      rateLimit:
        average: 100
        burst: 50
    secure-headers:
      headers:
        accessControlAllowMethods:
          - GET
          - OPTIONS
          - PUT
        accessControlMaxAge: 100
        hostsProxyHeaders:
          - "X-Forwarded-Host"
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        stsPreload: true
        customFrameOptionsValue: SAMEORIGIN
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "same-origin"
        permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=(), usb=(), vr=()"
        customResponseHeaders:
          X-Robots-Tag: "none,noarchive,nosnippet,notranslate,noimageindex,"
          server: ""
    api-headers:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        accessControlMaxAge: 100
        hostsProxyHeaders:
          - "X-Forwarded-Host"
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        stsPreload: true
        customFrameOptionsValue: SAMEORIGIN
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "no-referrer"
        permissionsPolicy: "none"
        customResponseHeaders:
          server: ""
    chain-secure:
      chain:
        middlewares:
          - crowdsec-bouncer
          - rate-limit
          - secure-headers
          - authentik
    chain-secure-ip:
      chain:
        middlewares:
          - ip-whitelist
          - crowdsec-bouncer
          - rate-limit
          - secure-headers
          - authentik
    chain-no-auth:
      chain:
        middlewares:
          - crowdsec-bouncer
          - rate-limit
          - secure-headers
    chain-api:
      chain:
        middlewares:
          - crowdsec-bouncer
          - rate-limit
          - api-headers
          - authentik